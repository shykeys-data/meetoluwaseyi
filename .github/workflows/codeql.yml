name: CodeQL

# Static security scan of the TypeScript (injection, XSS, unsafe redirects, secrets in code).
# Findings appear under Security → Code scanning. Free for public repositories.
on:
  push:
    branches: [dev]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
